<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale Conosco | Entre em Contato</title>
  <style>
    /* ==========================================================================
       Design System & Reset
       ========================================================================== */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #334155;
      --input-bg: #0f172a;
      --success-bg: #064e3b;
      --success-text: #34d399;
      --error-bg: #7f1d1d;
      --error-text: #f87171;
      --radius: 12px;
      --transition: all 0.25s ease-in-out;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    /* ==========================================================================
       Container & Layout
       ========================================================================== */
    .container {
      width: 100%;
      max-width: 960px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* ==========================================================================
       Sidebar / Informações de Contato
       ========================================================================== */
    .info-section {
      padding: 2.5rem;
      background-color: rgba(15, 23, 42, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border-color);
    }

    @media (max-width: 768px) {
      .info-section {
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        padding: 2rem;
      }
    }

    .info-header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    .info-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .info-details {
      margin: 2rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      font-style: normal;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 0.875rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .info-item svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .info-item a {
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
    }

    .info-item a:hover {
      color: var(--accent);
    }

    .social-links {
      display: flex;
      gap: 1rem;
    }

    .social-links a {
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .social-links a:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .social-links svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* ==========================================================================
       Formulário
       ========================================================================== */
    .form-section {
      padding: 2.5rem;
    }

    @media (max-width: 768px) {
      .form-section {
        padding: 2rem;
      }
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      transition: var(--transition);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .form-control::placeholder {
      color: #64748b;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 120px;
    }

    .btn-submit {
      width: 100%;
      padding: 0.875rem 1.5rem;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Mensagens de Notificação */
    .alert {
      padding: 0.875rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    .alert-success {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .alert-error {
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Seção de Informações -->
    <aside class="info-section">
      <div class="info-header">
        <h1>Vamos conversar</h1>
        <p>Preencha o formulário ao lado ou utilize nossos canais diretos para entrar em contato.</p>
      </div>

      <address class="info-details">
        <div class="info-item">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <div>
            <strong>E-mail</strong><br>
            <a href="mailto:contato@suaempresa.com">contato@suaempresa.com</a>
          </div>
        </div>

        <div class="info-item">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <div>
            <strong>Telefone</strong><br>
            <a href="tel:+5511999999999">+55 (11) 99999-9999</a>
          </div>
        </div>

        <div class="info-item">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <div>
            <strong>Localização</strong><br>
            <span>São Paulo, SP - Brasil</span>
          </div>
        </div>
      </address>

      <div class="social-links">
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        </a>
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        </a>
      </div>
    </aside>

    <!-- Seção do Formulário -->
    <main class="form-section">
      <div id="alertMessage" class="alert" role="alert"></div>

      <!-- 
        DICA DE INTEGRAÇÃO:
        Para receber as mensagens no seu e-mail sem backend, basta alterar a propriedade 'action' abaixo.
        Exemplo com Formspree: action="https://formspree.io/f/SEU_ID_AQUI"
      -->
      <form id="contactForm" action="#" method="POST" novalidate>
        <div class="form-group">
          <label for="name">Nome completo</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Seu nome" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="subject">Assunto</label>
          <input type="text" id="subject" name="subject" class="form-control" placeholder="Motivo do contato" required>
        </div>

        <div class="form-group">
          <label for="message">Mensagem</label>
          <textarea id="message" name="message" class="form-control" placeholder="Como podemos ajudar?" required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          Enviar Mensagem
        </button>
      </form>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contactForm');
      const submitBtn = document.getElementById('submitBtn');
      const alertMessage = document.getElementById('alertMessage');

      const showAlert = (message, type) => {
        alertMessage.textContent = message;
        alertMessage.className = `alert alert-${type}`;
        alertMessage.style.display = 'block';
      };

      const hideAlert = () => {
        alertMessage.style.display = 'none';
        alertMessage.textContent = '';
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const message = document.getElementById('message').value.trim();

        // Validação no cliente
        if (!name || !email || !subject || !message) {
          showAlert('Por favor, preencha todos os campos obrigatórios.', 'error');
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showAlert('Por favor, informe um endereço de e-mail válido.', 'error');
          return;
        }

        // Estado de carregamento
        submitBtn.disabled = true;
        const originalBtnText = submitBtn.textContent;
        submitBtn.textContent = 'Enviando...';

        try {
          const action = form.getAttribute('action');

          if (action && action !== '#') {
            // Envio para o serviço externo configurado na action
            const response = await fetch(action, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({ name, email, subject, message })
            });

            if (response.ok) {
              showAlert('Sua mensagem foi enviada com sucesso!', 'success');
              form.reset();
            } else {
              throw new Error('Erro na resposta do servidor.');
            }
          } else {
            // Simulação de envio para demonstração sem backend
            await new Promise(resolve => setTimeout(resolve, 800));
            showAlert('Sua mensagem foi enviada com sucesso! (Modo de demonstração)', 'success');
            form.reset();
          }
        } catch (error) {
          showAlert('Ocorreu um erro ao enviar. Tente novamente mais tarde.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalBtnText;
        }
      });
    });
  </script>
</body>
</html>
